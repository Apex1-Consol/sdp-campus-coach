<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDP Campus Coach</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;margin:0}
    main{max-width:760px;margin:40px auto;padding:24px}
    .card{background:white;border-radius:16px;padding:28px;box-shadow:0 6px 24px #0001}
    h1{margin-top:0;color:#164e63}
    button{background:#0f766e;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
    button:hover{background:#115e59}
    .progress{color:#64748b;font-size:14px}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p class="progress" id="progress"></p>
      <h1>SDP Campus Coach</h1>
      <h2 id="title"></h2>
      <p id="lesson"></p>
      <button id="complete">Mark lesson complete</button>
    </div>
  </main>

  <script>
    const lesson = {
      title: "What does a campus manager manage?",
      text: "A campus manager coordinates people, learners, programmes, facilities, evidence, quality, reporting, and risks. Your job is to make sure the right work happens, by the right person, with evidence that proves it happened."
    };

    const completed = localStorage.getItem("lesson-1-complete") === "true";

    document.getElementById("title").textContent = lesson.title;
    document.getElementById("lesson").textContent = lesson.text;
    document.getElementById("progress").textContent =
      completed ? "Lesson 1 complete" : "Module 1 · Lesson 1";

    document.getElementById("complete").onclick = () => {
      localStorage.setItem("lesson-1-complete", "true");
      document.getElementById("progress").textContent = "Lesson 1 complete";
      document.getElementById("complete").textContent = "Completed";
      document.getElementById("complete").disabled = true;
    };

    if (completed) {
      document.getElementById("complete").textContent = "Completed";
      document.getElementById("complete").disabled = true;
    }
  </script>
</body>
</html>
