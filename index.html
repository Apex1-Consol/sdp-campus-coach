<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDP Campus Coach</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      margin: 0;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 6px 24px #0001;
    }

    h1 {
      color: #164e63;
    }

    h2 {
      color: #172033;
    }

    button {
      background: #0f766e;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      margin-top: 12px;
    }

    button:hover {
      background: #115e59;
    }

    button:disabled {
      background: #94a3b8;
      cursor: default;
    }

    .progress {
      color: #64748b;
      font-size: 14px;
    }

    .quiz {
      border-top: 1px solid #e2e8f0;
      margin-top: 28px;
      padding-top: 20px;
    }

    label {
      display: block;
      margin: 12px 0;
    }

    #feedback {
      font-weight: bold;
      margin-top: 14px;
    }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <p class="progress" id="progress"></p>

      <h1>SDP Campus Coach</h1>

      <h2 id="title"></h2>

      <p id="lesson"></p>

      <button id="complete">Mark lesson complete</button>

      <div class="quiz">
        <h3>Knowledge check</h3>

        <p>Which is the campus manager’s core responsibility?</p>

        <label>
          <input type="radio" name="answer" value="wrong">
          Only teaching classes
        </label>

        <label>
          <input type="radio" name="answer" value="right">
          Coordinating people, evidence, quality and risks
        </label>

        <button id="check-answer">Check answer</button>

        <p id="feedback"></p>
      </div>
    </div>
  </main>

  <script>
    const lesson = {
      title: "What does a campus manager manage?",
      text: "A campus manager coordinates people, learners, programmes, facilities, evidence, quality, reporting, and risks. Your job is to make sure the right work happens, by the right person, with evidence that proves it happened."
    };

    const progress = document.getElementById("progress");
    const title = document.getElementById("title");
    const lessonText = document.getElementById("lesson");
    const completeButton = document.getElementById("complete");
    const checkAnswerButton = document.getElementById("check-answer");
    const feedback = document.getElementById("feedback");

    const completed =
      localStorage.getItem("lesson-1-complete") === "true";

    title.textContent = lesson.title;
    lessonText.textContent = lesson.text;

    function updateProgress() {
      if (localStorage.getItem("lesson-1-complete") === "true") {
        progress.textContent = "Lesson 1 complete";
        completeButton.textContent = "Completed";
        completeButton.disabled = true;
      } else {
        progress.textContent = "Module 1 · Lesson 1";
      }
    }

    completeButton.addEventListener("click", function () {
      localStorage.setItem("lesson-1-complete", "true");
      updateProgress();
    });

    checkAnswerButton.addEventListener("click", function () {
      const answer = document.querySelector(
        'input[name="answer"]:checked'
      );

      if (!answer) {
        feedback.textContent = "Please select an answer first.";
        feedback.style.color = "#b45309";
        return;
      }

      if (answer.value === "right") {
        feedback.textContent =
          "Correct. A manager makes the whole campus operation work.";
        feedback.style.color = "#15803d";
        localStorage.setItem("lesson-1-quiz", "passed");
      } else {
        feedback.textContent =
          "Try again. Think beyond teaching: people, evidence, quality and risks.";
        feedback.style.color = "#b91c1c";
      }
    });

    updateProgress();
  </script>
</body>
</html>
